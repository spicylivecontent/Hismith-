name: Relay server

on:
  push:
    branches: ["**"]
    paths:
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"
  pull_request:
    paths:
      - "relay-server/**"
      - ".github/workflows/relay-server.yml"
  workflow_dispatch:

jobs:
  test:
    name: Test relay server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: relay-server/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Docker image builds
        run: docker build -t hismith-relay .
