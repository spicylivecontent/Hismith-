name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug + release APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk     out/HismithSession-debug.apk
          cp app/build/outputs/apk/release/app-release.apk out/HismithSession-release.apk
          ls -la out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HismithSession-apk
          path: out/*.apk
          retention-days: 90

      # Every push to main (and every v* tag) also publishes a GitHub Release so the
      # APK can be downloaded straight to the phone without logging in to Actions.
      - name: Publish "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Hismith Session – senaste bygget
          body: |
            Automatiskt bygge från `main` (${{ github.sha }}).

            **Installera:** ladda ner `HismithSession-release.apk` på telefonen, öppna filen
            och tillåt installation från okänd källa.
          prerelease: true
          files: out/*.apk

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Hismith Session ${{ github.ref_name }}
          generate_release_notes: true
          files: out/*.apk
