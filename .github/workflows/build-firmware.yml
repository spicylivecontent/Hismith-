# Bygger MegaLube-firmware (firmware/megalube) till en .bin.
# Artefakten "MegaLube-bin" finns på varje körning; på main publiceras även releasen
# "MegaLube firmware" med MegaLube-merged.bin som kan laddas ner direkt i mobilen.
name: Build MegaLube firmware

on:
  push:
    branches: ["**"]
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/build-firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build MegaLube .bin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: firmware/megalube
    steps:
      - uses: actions/checkout@v4

      - name: Host test (lube_core.h)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I. test/lube_core_test.cpp -o lube_core_test
          ./lube_core_test

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core 2.0.17
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Compile
        run: |
          mkdir -p MegaLubeSlave
          cp MegaLubeSlave.ino lube_core.h MegaLubeSlave/
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --export-binaries MegaLubeSlave
          ls -R MegaLubeSlave/build

      - name: Merged image (flash at 0x0)
        run: |
          set -e
          B=$(dirname "$(find MegaLubeSlave/build -name 'MegaLubeSlave.ino.bin' | head -1)")
          mkdir -p out
          if [ -f "$B/MegaLubeSlave.ino.merged.bin" ]; then
            cp "$B/MegaLubeSlave.ino.merged.bin" out/MegaLube-merged.bin
          else
            pip install --quiet "esptool>=4.7,<5"
            BOOT_APP0=$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)
            esptool.py --chip esp32 merge_bin -o out/MegaLube-merged.bin \
              --flash_mode keep --flash_freq keep --flash_size 4MB \
              0x1000  "$B/MegaLubeSlave.ino.bootloader.bin" \
              0x8000  "$B/MegaLubeSlave.ino.partitions.bin" \
              0xe000  "$BOOT_APP0" \
              0x10000 "$B/MegaLubeSlave.ino.bin"
          fi
          cp "$B/MegaLubeSlave.ino.bin" out/MegaLube-app-0x10000.bin
          ls -la out
          sha256sum out/*.bin | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MegaLube-bin
          path: |
            firmware/megalube/out/
            firmware/megalube/MegaLubeSlave/build
          retention-days: 90

      - name: Publish firmware release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: megalube-firmware
          name: MegaLube firmware (senaste)
          body: |
            Färdig firmware för MegaLube (ESP32-WROOM-32 + DRV8871), byggd från `${{ github.sha }}`.

            **Flasha:** `MegaLube-merged.bin` på adress **0x0** (ESPFlash eller WebSerial ESPTool).
            `MegaLube-app-0x10000.bin` är bara app-delen.
          prerelease: false
          make_latest: false
          files: |
            firmware/megalube/out/MegaLube-merged.bin
            firmware/megalube/out/MegaLube-app-0x10000.bin
            firmware/megalube/out/SHA256SUMS.txt
