# Bygger MegaLube-firmware till en färdig .bin.
# Den här filen hör till ett EGET repo där innehållet i firmware/megalube ligger i roten
# (MegaLubeSlave.ino, lube_core.h, test/, README.md). I Hismith- används
# .github/workflows/build-firmware.yml i stället.
name: Bygg MegaLube

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Testa logiken (lube_core.h) på datorn
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I. test/lube_core_test.cpp -o lube_core_test
          ./lube_core_test

      - uses: arduino/setup-arduino-cli@v2

      - name: Installera ESP32-kärnan
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17

      - name: Kompilera
        run: |
          mkdir -p MegaLubeSlave
          cp MegaLubeSlave.ino lube_core.h MegaLubeSlave/
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --export-binaries MegaLubeSlave
          ls -R MegaLubeSlave/build

      - name: Gör en sammanslagen .bin (flashas på adress 0x0)
        run: |
          set -e
          B=$(dirname "$(find MegaLubeSlave/build -name 'MegaLubeSlave.ino.bin' | head -1)")
          mkdir -p out
          if [ -f "$B/MegaLubeSlave.ino.merged.bin" ]; then
            cp "$B/MegaLubeSlave.ino.merged.bin" out/MegaLube-merged.bin
          else
            pip install --quiet "esptool>=4.7,<5"
            BOOT_APP0=$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)
            esptool.py --chip esp32 merge_bin -o out/MegaLube-merged.bin \
              --flash_mode keep --flash_freq keep --flash_size 4MB \
              0x1000  "$B/MegaLubeSlave.ino.bootloader.bin" \
              0x8000  "$B/MegaLubeSlave.ino.partitions.bin" \
              0xe000  "$BOOT_APP0" \
              0x10000 "$B/MegaLubeSlave.ino.bin"
          fi
          cp "$B/MegaLubeSlave.ino.bin" out/MegaLube-app-0x10000.bin
          ls -la out
          sha256sum out/*.bin | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MegaLube-bin
          path: |
            out/
            MegaLubeSlave/build

      - name: Publicera som release (ladda ner .bin direkt i mobilen)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware-latest
          name: MegaLube firmware (senaste)
          body: |
            Färdig firmware för MegaLube (ESP32-WROOM-32 + DRV8871), byggd från `${{ github.sha }}`.

            **Flasha:** `MegaLube-merged.bin` på adress **0x0** (ESPFlash eller WebSerial ESPTool).
            `MegaLube-app-0x10000.bin` är bara app-delen, för den som redan har bootloader och partitioner på 0x10000.
          prerelease: false
          make_latest: true
          files: |
            out/MegaLube-merged.bin
            out/MegaLube-app-0x10000.bin
            out/SHA256SUMS.txt
